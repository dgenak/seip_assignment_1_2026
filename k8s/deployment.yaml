apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-api
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: echo-api
  template:
    metadata:
      labels:
        app: echo-api
    spec:
      containers:
      - name: echo-api
        image: ghcr.io/dgenak/echo-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
        
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5